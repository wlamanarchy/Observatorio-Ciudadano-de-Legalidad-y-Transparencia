name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Observatorio
        run: |
          npm install
          npm run build
          mkdir -p /tmp/observatorio-pages
          cp -R dist/. /tmp/observatorio-pages/

      - name: Build CONSENSO
        working-directory: participacion-ciudadana
        run: |
          npm install
          npm run build

      - name: Assemble separated public routes
        run: |
          mkdir -p dist/observatorio dist/consenso dist/participacion
          cp -R /tmp/observatorio-pages/. dist/observatorio/
          cp -R participacion-ciudadana/dist/. dist/consenso/
          cat > dist/participacion/index.html <<'EOF'
          <!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../consenso/"><title>CONSENSO</title></head><body><p>CONSENSO ahora está en <a href="../consenso/">/consenso/</a>.</p></body></html>
          EOF
          cp pages/portal-index.html dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
